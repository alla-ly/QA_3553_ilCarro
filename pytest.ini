[pytest]
markers =
    smoke:critical checks covering the core PhoneBook flows
    regression: full regression suite, including all negative scenarios

log_file = logs/test_run.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

log_cli = true
log_cli_level = INFO

addopts = --alluredir=allure-results --clean-alluredir
