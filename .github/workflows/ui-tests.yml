name: UI Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run UI tests (${{ matrix.browser }})
        env:
          EXISTING_USER_EMAIL: ${{ secrets.EXISTING_USER_EMAIL }}
          EXISTING_USER_PASSWORD: ${{ secrets.EXISTING_USER_PASSWORD }}
        run: pytest -v --browser=${{ matrix.browser }} --headless --alluredir=allure-results

      - name: Upload diagnostics (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-diagnostics
          path: |
            logs/
            screenshots/
            allure-results/
          if-no-files-found: ignore